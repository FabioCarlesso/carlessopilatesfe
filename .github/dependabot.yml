version: 2
updates:
  # Dependencias npm do frontend Angular.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular*"
          - "@angular-devkit/*"
          - "@schematics/*"
      dev-dependencies:
        dependency-type: development

  # Actions usadas nos workflows do GitHub.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
