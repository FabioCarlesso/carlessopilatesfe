name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancela execucoes anteriores ainda em andamento para o mesmo branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # ubuntu-latest ja traz o Google Chrome pre-instalado; o launcher
      # ChromeHeadlessCI (karma.conf.js) roda headless com --no-sandbox.
      - run: npm run test:ci
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # O build de producao valida os budgets configurados em angular.json.
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/carlessopilatesfe/
          if-no-files-found: error

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    # Valida a imagem apenas em merges na master (nao em cada PR).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: carlessopilatesfe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Publicacao futura no GitHub Container Registry (GHCR): descomente o
      # login abaixo, ajuste `push: true` e `tags` no passo acima e conceda
      # `permissions: packages: write` a este job.
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
