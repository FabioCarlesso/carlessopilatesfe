<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carlesso · 02 Componentes</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { background: #0e1620; }
  body { color: var(--text-primary); }
  .artboard-frame { background: var(--bg-app); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="common.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const ComponentesTweakDefaults = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "density": "default"
}/*EDITMODE-END*/;

function Frame({ width, height, children, theme = 'light', density = 'default' }) {
  return (
    <div
      data-theme={theme}
      data-density={density}
      className="artboard-frame"
      style={{
        width, height, overflow: 'hidden',
        background: 'var(--bg-app)',
        color: 'var(--text-primary)',
      }}
    >
      {children}
    </div>
  );
}

function DesignSystemComponents() {
  const [tab, setTab] = useState('planos');
  return (
    <div style={{ padding: '56px 64px', display: 'flex', flexDirection: 'column', gap: 40 }}>
      <div style={{ borderBottom: '1px solid var(--border-default)', paddingBottom: 16 }}>
        <Eyebrow>Design system · 02 componentes</Eyebrow>
        <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 64, lineHeight: 1, margin: '8px 0 0', letterSpacing: '0' }}>
          Componentes
        </h1>
      </div>

      <div>
        <Eyebrow>Botões</Eyebrow>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 24, marginTop: 16 }}>
          {[
            { l: 'Primário', n: <Button variant="primary" icon="check">Confirmar</Button> },
            { l: 'Secundário', n: <Button variant="secondary" icon="download">Exportar</Button> },
            { l: 'Ghost', n: <Button variant="ghost" icon="edit">Editar</Button> },
            { l: 'Destrutivo', n: <Button variant="danger" icon="trash">Excluir</Button> },
          ].map((b, i) => (
            <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 8, padding: 20, border: '1px solid var(--border-subtle)', borderRadius: 6, background: 'var(--bg-paper)' }}>
              <span style={{ fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>{b.l}</span>
              {b.n}
            </div>
          ))}
        </div>
      </div>

      <div>
        <Eyebrow>Inputs &amp; Forms</Eyebrow>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24, marginTop: 16 }}>
          <Field label="Texto" hint="Campo padrão"><input className="input" defaultValue="Carolina Vasques" /></Field>
          <Field label="Com ícone">
            <div className="input-wrap">
              <span className="input-wrap__icon"><Icon name="search" size={16} /></span>
              <input className="input input--with-icon" placeholder="Buscar…" />
            </div>
          </Field>
          <Field label="Select">
            <select className="select" defaultValue="anual">
              <option value="anual">Anual · 3x/sem</option>
              <option>Trimestral · 2x/sem</option>
            </select>
          </Field>
          <Field label="Erro" error="Informe um e-mail válido">
            <input className="input" defaultValue="email@" style={{ borderColor: 'var(--c-danger)' }} />
          </Field>
          <Field label="Desabilitado"><input className="input" disabled defaultValue="Bloqueado" /></Field>
          <Field label="Textarea"><textarea className="textarea" placeholder="—" /></Field>
        </div>
        <div style={{ display: 'flex', gap: 32, marginTop: 24 }}>
          <label className="check"><input type="checkbox" defaultChecked /><span className="check__box"><Icon name="check" size={11} /></span>Concorda com a LGPD</label>
          <label className="check"><input type="checkbox" /><span className="check__box"><Icon name="check" size={11} /></span>Receber lembretes por e-mail</label>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 13 }}>
            <span>Dark mode</span>
            <span className="switch switch--on" />
          </div>
        </div>
      </div>

      <div>
        <Eyebrow>Badges</Eyebrow>
        <div style={{ display: 'flex', gap: 12, marginTop: 16, flexWrap: 'wrap' }}>
          <Badge dot>Inativo</Badge>
          <Badge variant="success" dot>Realizada</Badge>
          <Badge variant="info" dot>Em andamento</Badge>
          <Badge variant="warning" dot>Pendente</Badge>
          <Badge variant="danger" dot>Atrasado</Badge>
          <Badge variant="brand">Anual</Badge>
        </div>
      </div>

      <div>
        <Eyebrow>Tabela</Eyebrow>
        <div className="table-wrap" style={{ marginTop: 16 }}>
          <table className="table">
            <thead>
              <tr><th>Paciente</th><th>Plano</th><th>Próxima</th><th>Status</th></tr>
            </thead>
            <tbody>
              {[
                { n: 'Ana Beatriz Moretti', p: 'Mensal · 3x', d: '29 abr', s: 'Ativo' },
                { n: 'Bruno Henrique Cavalcante', p: 'Trimestral · 2x', d: '30 abr', s: 'Ativo' },
                { n: 'Carolina Vasques de Almeida', p: 'Anual · 3x', d: '02 mai', s: 'Ativo' },
              ].map((r, i) => (
                <tr key={i}>
                  <td><div style={{ display: 'flex', alignItems: 'center', gap: 12 }}><Avatar name={r.n} size={32} /><span style={{ fontWeight: 500 }}>{r.n}</span></div></td>
                  <td>{r.p}</td>
                  <td><span style={{ fontFamily: 'var(--font-aux)', fontStyle: 'italic' }}>{r.d}</span></td>
                  <td><Badge variant="success" dot>{r.s}</Badge></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
        <div className="card">
          <div className="card__header">
            <div>
              <Eyebrow>Card</Eyebrow>
              <h3 className="t-h2" style={{ marginTop: 4 }}>Plano vigente</h3>
            </div>
            <Button variant="ghost" size="sm" iconRight="arrow-right">Detalhes</Button>
          </div>
          <div className="card__body">
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 32 }}>Anual · 3 aulas/sem</div>
            <p style={{ marginTop: 8, color: 'var(--text-secondary)' }}>Vigência até 11 jan 2027 · ter, qui, sáb · 08:00.</p>
          </div>
          <div className="card__footer">
            <Button variant="ghost">Cancelar</Button>
            <Button variant="primary">Renovar</Button>
          </div>
        </div>
        <div className="card">
          <div className="card__header"><Eyebrow>Tabs</Eyebrow></div>
          <div style={{ padding: '0 24px' }}>
            <Tabs activeKey={tab} onChange={setTab} items={[
              { key: 'overview', label: 'Visão geral' },
              { key: 'planos', label: 'Planos', count: 3 },
              { key: 'pgto', label: 'Pagamentos', count: 12 },
              { key: 'aulas', label: 'Aulas', count: 84 },
            ]} />
          </div>
          <div className="card__body">
            <p style={{ color: 'var(--text-secondary)' }}>Conteúdo da aba selecionada.</p>
          </div>
        </div>
      </div>
    </div>
  );
}

const BrowserWindow = ({ title, url, children, ...rest }) =>
  <ChromeWindow url={url} tabs={[{ title: title || 'Carlesso' }]} {...rest}>{children}</ChromeWindow>;

function App() {
  const [tweaks, setTweak] = useTweaks(ComponentesTweakDefaults);
  const { theme, density } = tweaks;

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-density', density);
  }, [theme, density]);

  const W = 1440, H = 1300;

  return (
    <>
      <DesignCanvas
        title="Componentes · botões, inputs, tabelas, badges"
        subtitle="Carlesso · página 02 do design system"
      >
        <DCSection id="componentes" title="Sistema visual · 02 Componentes">
          <DCArtboard id="ds-components" label="Componentes · botões, inputs, tabelas, badges" width={W} height={H}>
            <BrowserWindow url="carlesso.design/componentes" title="Carlesso · 02 Componentes">
              <Frame width={W} height={H - 38} theme={theme} density={density}>
                <DesignSystemComponents />
              </Frame>
            </BrowserWindow>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Aparência">
          <TweakRadio
            label="Tema"
            value={tweaks.theme}
            options={[{value:'light', label:'Claro'}, {value:'dark', label:'Escuro'}]}
            onChange={v => setTweak('theme', v)}
          />
          <TweakRadio
            label="Densidade"
            value={tweaks.density}
            options={[{value:'compact', label:'Compacta'}, {value:'default', label:'Padrão'}, {value:'comfortable', label:'Confortável'}]}
            onChange={v => setTweak('density', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
