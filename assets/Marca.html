<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carlesso · 03 Marca</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { background: #0e1620; }
  body { color: var(--text-primary); }
  .artboard-frame { background: var(--bg-app); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="common.jsx"></script>

<script type="text/babel">
const { useEffect } = React;

const MarcaTweakDefaults = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "density": "default",
  "pattern": true
}/*EDITMODE-END*/;

function Frame({ width, height, children, theme = 'light', density = 'default' }) {
  return (
    <div
      data-theme={theme}
      data-density={density}
      className="artboard-frame"
      style={{
        width, height, overflow: 'hidden',
        background: 'var(--bg-app)',
        color: 'var(--text-primary)',
      }}
    >
      {children}
    </div>
  );
}

function DesignSystemBrand({ patternEnabled = true }) {
  return (
    <div style={{ padding: '56px 64px', display: 'flex', flexDirection: 'column', gap: 40 }}>
      <div style={{ borderBottom: '1px solid var(--border-default)', paddingBottom: 16 }}>
        <Eyebrow>Design system · 03 marca</Eyebrow>
        <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 64, lineHeight: 1, margin: '8px 0 0', letterSpacing: '0' }}>
          A marca em uso
        </h1>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24 }}>
        <PatternBackground opacity={patternEnabled ? 0.06 : 0} density="dense" style={{ padding: 32, background: 'var(--c-cloud-dancer)', borderRadius: 6, border: '1px solid var(--border-subtle)' }}>
          <Eyebrow>Símbolo</Eyebrow>
          <div style={{ marginTop: 24, display: 'grid', placeItems: 'center', height: 160 }}>
            <SymbolFancy size={120} color="var(--c-horizonte)" />
          </div>
          <p style={{ marginTop: 12, fontSize: 12, color: 'var(--text-secondary)' }}>4 círculos entrelaçados — centralização e fundação. Uso solo em favicon, splash, empty states.</p>
        </PatternBackground>

        <div style={{ padding: 32, background: 'var(--c-horizonte)', borderRadius: 6, color: 'var(--c-cloud-dancer)' }}>
          <div style={{ fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--c-azul-soft)' }}>Lockup horizontal</div>
          <div style={{ marginTop: 24, display: 'grid', placeItems: 'center', height: 160 }}>
            <Lockup size={56} layout="horizontal" tagline="Pilates e Fisioterapia" color="var(--c-cloud-dancer)" />
          </div>
          <p style={{ marginTop: 12, fontSize: 12, color: 'var(--c-azul-soft)' }}>Topbar, login, e-mails. Símbolo + wordmark + sublinha.</p>
        </div>

        <div style={{ padding: 32, background: 'var(--c-tempestade)', borderRadius: 6, color: 'var(--c-cloud-dancer)' }}>
          <div style={{ fontSize: 11, letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--c-azul-3)' }}>Lockup vertical</div>
          <div style={{ marginTop: 16, display: 'grid', placeItems: 'center', height: 180 }}>
            <Lockup size={56} layout="vertical" tagline="Centro de Contrologia" color="var(--c-cloud-dancer)" />
          </div>
          <p style={{ marginTop: 8, fontSize: 12, color: 'var(--c-azul-3)' }}>Login, capas, modais formais.</p>
        </div>
      </div>

      <div>
        <Eyebrow>Padronagens · símbolo repetido</Eyebrow>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, marginTop: 16 }}>
          {[
            { d: 'sparse', label: 'Esparsa · login, capas' },
            { d: 'normal', label: 'Padrão · empty states, dividers' },
            { d: 'dense', label: 'Densa · selo, área pequena' },
          ].map((p, i) => (
            <PatternBackground key={i} opacity={patternEnabled ? 0.12 : 0} density={p.d} style={{
              height: 200, background: 'var(--c-cloud-dancer)', borderRadius: 6,
              border: '1px solid var(--border-subtle)', position: 'relative',
            }}>
              <div style={{ position: 'absolute', bottom: 12, left: 16, fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--text-secondary)' }}>{p.label}</div>
            </PatternBackground>
          ))}
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
        <div style={{ padding: 32, background: 'var(--bg-paper)', border: '1px solid var(--border-subtle)', borderRadius: 6 }}>
          <Eyebrow>Citações · molduras [ ]</Eyebrow>
          <div style={{ marginTop: 16 }}>
            <BracketFrame>
              Uma estrutura só permanece de pé se cada componente estiver em harmonia.
            </BracketFrame>
          </div>
          <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 12 }}>Uso editorial em login, dashboards, empty states. Nunca em tabelas ou formulários.</p>
        </div>
        <div style={{ padding: 32, background: 'var(--bg-paper)', border: '1px solid var(--border-subtle)', borderRadius: 6 }}>
          <Eyebrow>Voz da marca · do nosso</Eyebrow>
          <ul style={{ margin: '12px 0 0', padding: 0, listStyle: 'none', display: 'flex', flexDirection: 'column', gap: 8, fontSize: 13, color: 'var(--text-secondary)' }}>
            <li>→ "Bom dia, Claudia." (não "Olá!")</li>
            <li>→ "Cadastrar paciente" (não "Adicionar novo")</li>
            <li>→ "Aula realizada" (não "Aula concluída com sucesso")</li>
            <li>→ "Onde a ciência encontra a arte de mover-se."</li>
          </ul>
        </div>
      </div>
    </div>
  );
}

const BrowserWindow = ({ title, url, children, ...rest }) =>
  <ChromeWindow url={url} tabs={[{ title: title || 'Carlesso' }]} {...rest}>{children}</ChromeWindow>;

function App() {
  const [tweaks, setTweak] = useTweaks(MarcaTweakDefaults);
  const { theme, density, pattern } = tweaks;

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-density', density);
  }, [theme, density]);

  const W = 1440, H = 1000;

  return (
    <>
      <DesignCanvas
        title="Marca · símbolo, lockup, padronagens"
        subtitle="Carlesso · página 03 do design system"
      >
        <DCSection id="marca" title="Sistema visual · 03 Marca">
          <DCArtboard id="ds-brand" label="Marca · símbolo, lockup, padronagens" width={W} height={H}>
            <BrowserWindow url="carlesso.design/marca" title="Carlesso · 03 Marca">
              <Frame width={W} height={H - 38} theme={theme} density={density}>
                <DesignSystemBrand patternEnabled={pattern} />
              </Frame>
            </BrowserWindow>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Aparência">
          <TweakRadio
            label="Tema"
            value={tweaks.theme}
            options={[{value:'light', label:'Claro'}, {value:'dark', label:'Escuro'}]}
            onChange={v => setTweak('theme', v)}
          />
          <TweakRadio
            label="Densidade"
            value={tweaks.density}
            options={[{value:'compact', label:'Compacta'}, {value:'default', label:'Padrão'}, {value:'comfortable', label:'Confortável'}]}
            onChange={v => setTweak('density', v)}
          />
        </TweakSection>
        <TweakSection title="Marca">
          <TweakToggle label="Padronagens visíveis" value={tweaks.pattern} onChange={v => setTweak('pattern', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
