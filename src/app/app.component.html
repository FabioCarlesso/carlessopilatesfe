@if (authService.isAuthenticated()) {
  <nav class="navbar">
    <div class="navbar-brand">
      <a routerLink="/">Carlesso Pilates</a>
    </div>
    <ul class="navbar-menu">
      <li><a routerLink="/">Início</a></li>
      <li><a routerLink="/pacientes">Pacientes</a></li>
      @if (authService.isAdmin()) {
        <li><a routerLink="/profissionais">Profissionais</a></li>
        <li><a routerLink="/relatorios">Relatórios</a></li>
        <li><a routerLink="/admin">Administração</a></li>
      }
    </ul>
    <div class="navbar-actions">
      <a routerLink="/perfil/alterar-senha" class="btn-alterar-senha">Alterar senha</a>
      <button
        type="button"
        class="btn-tema"
        (click)="toggleTheme()"
        [attr.aria-pressed]="isDarkTheme"
        [attr.aria-label]="isDarkTheme ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
      >
        {{ isDarkTheme ? 'Tema claro' : 'Tema escuro' }}
      </button>
      <button class="btn-sair" (click)="sair()">Sair</button>
    </div>
  </nav>
}

<main class="container">
  <router-outlet />
</main>
