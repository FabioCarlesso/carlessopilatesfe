@if (authService.isAuthenticated()) {
  <nav class="navbar" [class.is-open]="menuAberto">
    <div class="navbar-inner">
      <div class="navbar-brand">
        <a routerLink="/inicio" (click)="fecharMenu()">Carlesso Pilates</a>
      </div>
      <button
        type="button"
        class="navbar-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuAberto"
        [attr.aria-label]="menuAberto ? 'Fechar menu' : 'Abrir menu'"
        aria-controls="navbar-collapse"
      >
        <span aria-hidden="true">☰</span> Menu
      </button>
      <div class="navbar-collapse" id="navbar-collapse">
        <ul class="navbar-menu">
          <li>
            <a
              routerLink="/inicio"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
              (click)="fecharMenu()"
            >Início</a>
          </li>
          <li>
            <a
              routerLink="/agenda"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              (click)="fecharMenu()"
            >Agenda</a>
          </li>
          <li>
            <a
              routerLink="/pacientes"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              (click)="fecharMenu()"
            >Pacientes</a>
          </li>
          @if (authService.isAdmin()) {
            <li>
              <a
                routerLink="/profissionais"
                routerLinkActive="is-active"
                ariaCurrentWhenActive="page"
                (click)="fecharMenu()"
              >Profissionais</a>
            </li>
            <li>
              <a
                routerLink="/relatorios"
                routerLinkActive="is-active"
                ariaCurrentWhenActive="page"
                (click)="fecharMenu()"
              >Relatórios</a>
            </li>
            <li>
              <a
                routerLink="/admin"
                routerLinkActive="is-active"
                ariaCurrentWhenActive="page"
                (click)="fecharMenu()"
              >Administração</a>
            </li>
          }
        </ul>
        <div class="navbar-actions">
          <app-busca-global />
          <app-menu-conta />
        </div>
      </div>
    </div>
  </nav>
}

<main [class.container]="!layoutFluido">
  @if (notificacoes.notificacao(); as notificacao) {
    <div class="alert alert-danger notificacao-global" role="alert">
      <span>{{ notificacao.mensagem }}</span>
      <button
        type="button"
        class="notificacao-fechar"
        aria-label="Fechar mensagem"
        (click)="notificacoes.limpar()"
      >
        ✕
      </button>
    </div>
  }
  <router-outlet />
</main>
