<div class="pagination-summary">
  <span>Exibindo {{ pageStart() }}-{{ pageEnd() }} de {{ totalElements }} {{ itemLabel }}</span>

  <label>
    Itens por página
    <select #pageSizeSelect class="form-control" (change)="aoAlterarTamanho(pageSizeSelect.value)">
      @for (size of pageSizeOptions; track size) {
        <option [value]="size" [selected]="size === pageSize">{{ size }}</option>
      }
    </select>
  </label>
</div>
