<nav *ngIf="items.length" aria-label="breadcrumb" class="breadcrumb-nav">
  <ol class="breadcrumb">
    <li *ngFor="let item of items; let last = last" class="breadcrumb-item">
      <a *ngIf="!last && item.link" [routerLink]="item.link" class="breadcrumb-link">{{ item.label }}</a>
      <span *ngIf="!last && !item.link" class="breadcrumb-text">{{ item.label }}</span>
      <span *ngIf="last" class="breadcrumb-current" aria-current="page">{{ item.label }}</span>
      <span *ngIf="!last" class="breadcrumb-separator" aria-hidden="true">/</span>
    </li>
  </ol>
</nav>
