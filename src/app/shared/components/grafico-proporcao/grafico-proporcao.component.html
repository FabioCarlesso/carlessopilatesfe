<figure class="grafico-proporcao" [class.grafico-proporcao--com-rosca]="tipo === 'rosca'" [attr.aria-label]="titulo">
  @if (tipo === 'rosca') {
    <div class="grafico-proporcao__rosca">
      <svg viewBox="0 0 42 42" aria-hidden="true" focusable="false">
        <circle class="grafico-proporcao__trilho" cx="21" cy="21" r="16" />
        <!-- Gira o ponto de partida das fatias das 3h para as 12h. -->
        <g transform="rotate(-90 21 21)">
          @for (segmento of proporcao.segmentos; track segmento.chave) {
            @if (segmento.valor > 0) {
              <circle
                [attr.class]="'grafico-proporcao__fatia grafico-proporcao--' + segmento.variante"
                [attr.data-chave]="segmento.chave"
                cx="21" cy="21" r="16" pathLength="100"
                [attr.stroke-dasharray]="tracoFatia(segmento.fracao)"
                [attr.stroke-dashoffset]="deslocamentoFatia(segmento.inicio)" />
            }
          }
        </g>
      </svg>
      <div class="grafico-proporcao__centro" aria-hidden="true">
        <strong>{{ proporcao.total }}</strong>
        <span>{{ rotuloTotal }}</span>
      </div>
    </div>
  } @else {
    <div class="grafico-proporcao__barra" aria-hidden="true">
      @for (segmento of proporcao.segmentos; track segmento.chave) {
        @if (segmento.valor > 0) {
          <span
            [class]="'grafico-proporcao__parte grafico-proporcao--' + segmento.variante"
            [attr.data-chave]="segmento.chave"
            [style.width.%]="segmento.fracao * 100"></span>
        }
      }
    </div>
  }

  <ul class="grafico-proporcao__legenda">
    @for (segmento of proporcao.segmentos; track segmento.chave) {
      <li [class]="'grafico-proporcao__item grafico-proporcao--' + segmento.variante" [attr.data-chave]="segmento.chave">
        <span class="grafico-proporcao__marca" aria-hidden="true"></span>
        <!-- O espaço inicial de valor e percentual é deliberado: o Angular descarta o
             espaço entre elementos, e sem ele o texto lido seria "Pagos854%". No
             flex o espaço de borda do item não ocupa lugar na tela. -->
        <span class="grafico-proporcao__rotulo">{{ segmento.rotulo }}</span>
        <strong class="grafico-proporcao__valor"> {{ segmento.valor }}</strong>
        <span class="grafico-proporcao__percentual"> {{ segmento.percentual }}%</span>
      </li>
    }
  </ul>

  @if (proporcao.total === 0) {
    <p class="grafico-proporcao__vazio">{{ textoVazio }}</p>
  }
</figure>
