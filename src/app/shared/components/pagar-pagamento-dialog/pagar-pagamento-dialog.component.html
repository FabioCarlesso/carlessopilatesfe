<app-confirmar-dialog
  titulo="Confirmar Pagamento"
  variante="primaria"
  [processando]="processando()"
  [fecharAoClicarFora]="false"
  (confirmar)="confirmar()"
  (cancelar)="fechar()">
  <form [formGroup]="form">
    <div class="form-group">
      <label for="dataPagamento">Data do Pagamento *</label>
      <input id="dataPagamento" formControlName="dataPagamento" type="date" class="form-control" />
    </div>
    <div class="form-group">
      <label for="formaPagamento">Forma de Pagamento</label>
      <select id="formaPagamento" formControlName="formaPagamento" class="form-control">
        <option [ngValue]="null">Não informada</option>
        @for (forma of formasPagamento; track forma) {
          <option [ngValue]="forma">{{ formaPagamentoLabel[forma] }}</option>
        }
      </select>
    </div>
  </form>
</app-confirmar-dialog>
