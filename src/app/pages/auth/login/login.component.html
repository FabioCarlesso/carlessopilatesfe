<div class="login-container">
  <button
    type="button"
    class="btn btn-outline btn-sm login-theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-pressed]="isDarkTheme"
    [attr.aria-label]="isDarkTheme ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
  >
    {{ isDarkTheme ? 'Tema claro' : 'Tema escuro' }}
  </button>

  <div class="login-card">
    <h1 class="login-title">Carlesso Pilates</h1>
    <p class="login-subtitle">Área administrativa</p>

    @if (aviso) {
      <div class="login-aviso" role="status">{{ aviso }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="entrar()" class="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="admin@carlessopilates.com"
          autocomplete="email"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="field-error">E-mail inválido.</span>
        }
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Senha"
          autocomplete="current-password"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="field-error">Senha obrigatória.</span>
        }
      </div>

      @if (erro) {
        <div class="login-erro">{{ erro }}</div>
      }

      <button type="submit" class="btn-entrar" [disabled]="form.invalid || carregando">
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>

      <a routerLink="/esqueci-senha" class="login-link">Esqueci minha senha</a>
    </form>
  </div>
</div>
