<div class="page-header">
  <h1>Profissionais</h1>
  <a routerLink="/profissionais/novo" class="btn btn-primary">+ Novo Profissional</a>
</div>

<div *ngIf="erro" class="alert alert-danger">{{ erro }}</div>

<button
  type="button"
  class="filtros-toggle"
  (click)="alternarFiltros()"
  [attr.aria-expanded]="filtrosAbertos"
  [attr.aria-label]="filtrosAbertos ? 'Recolher filtros' : 'Expandir filtros'"
  aria-controls="filtros-profissionais">
  <span>Filtros</span>
  <span *ngIf="filtrosAtivos() > 0" class="filtros-badge" [attr.aria-label]="filtrosAtivos() + ' filtros ativos'">{{ filtrosAtivos() }}</span>
  <span class="filtros-caret" aria-hidden="true">▾</span>
</button>

<form id="filtros-profissionais" class="filters" [class.filtros-recolhidos]="!filtrosAbertos" (ngSubmit)="buscar()">
  <label>
    Nome
    <input type="text" name="nome" [(ngModel)]="filtro.nome" placeholder="Nome do profissional">
  </label>

  <label>
    E-mail
    <input type="email" name="email" [(ngModel)]="filtro.email" placeholder="email@exemplo.com">
  </label>

  <label>
    Contrato
    <select name="tipoContrato" [(ngModel)]="filtro.tipoContrato">
      <option value="">Todos</option>
      <option *ngFor="let tipo of tiposContrato" [value]="tipo">{{ tipoContratoLabel[tipo] }}</option>
    </select>
  </label>

  <label>
    % por Aula
    <input type="number" name="percentualPagamentoAula" min="0" max="100" step="0.01"
      [(ngModel)]="filtro.percentualPagamentoAula" placeholder="Ex.: 45">
  </label>

  <label>
    Status
    <select name="status" [(ngModel)]="filtro.status">
      <option value="todos">Todos</option>
      <option value="ativos">Ativos</option>
      <option value="inativos">Inativos</option>
    </select>
  </label>

  <div class="filter-actions">
    <button type="submit" class="btn btn-primary">Buscar</button>
    <button type="button" class="btn btn-outline" (click)="limparFiltros()">Limpar</button>
  </div>
</form>

<div *ngIf="loading" class="loading">Carregando...</div>

<div *ngIf="!loading && profissionais.length === 0 && !erro" class="empty-state">
  Nenhum profissional ativo cadastrado.
</div>

<div *ngIf="profissionais.length > 0" class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Contrato</th>
        <th>% por Aula</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of profissionais; trackBy: trackByProfissional">
        <td>{{ p.nome }}</td>
        <td>{{ p.email }}</td>
        <td>{{ tipoContratoLabel[p.tipoContrato] }}</td>
        <td>{{ p.percentualPagamentoAula }}%</td>
        <td class="acoes">
          <a [routerLink]="['/profissionais', p.id]" class="btn btn-sm btn-outline">Ver</a>
          <a [routerLink]="['/profissionais', p.id, 'editar']" class="btn btn-sm btn-secondary">Editar</a>
          <button class="btn btn-sm btn-danger" (click)="confirmarInativar(p.id)">Inativar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="pagination" *ngIf="totalPages > 1" role="navigation" aria-label="Paginação de profissionais">
  <button
    type="button"
    class="page-nav-mobile"
    aria-label="Página anterior"
    [disabled]="currentPage === 0"
    (click)="pagina(currentPage - 1)">
    Anterior
  </button>
  <span class="page-status" aria-live="polite">Página {{ currentPage + 1 }} de {{ totalPages }}</span>
  <button
    *ngFor="let p of visiblePages"
    class="page-number"
    [class.active]="p === currentPage"
    [attr.aria-label]="'Página ' + (p + 1)"
    [attr.aria-current]="p === currentPage ? 'page' : null"
    (click)="pagina(p)">
    {{ p + 1 }}
  </button>
  <button
    type="button"
    class="page-nav-mobile"
    aria-label="Próxima página"
    [disabled]="currentPage === totalPages - 1"
    (click)="pagina(currentPage + 1)">
    Próxima
  </button>
</div>

<app-confirmar-dialog
  *ngIf="confirmarInativarId !== null"
  titulo="Confirmar inativação"
  mensagem="Confirma a inativação do profissional?"
  variante="perigo"
  [processando]="acaoEmAndamento"
  (confirmar)="inativar()"
  (cancelar)="cancelarInativar()" />
