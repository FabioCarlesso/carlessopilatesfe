<div class="page-header">
  <div>
    <h1>{{ modoEdicao ? 'Editar' : 'Registrar' }} NFSE Emitida</h1>
    <p *ngIf="paciente" class="page-subtitle">{{ paciente.nome }}</p>
  </div>
  <div class="acoes">
    <a *ngIf="pacienteId" [routerLink]="['/pacientes', pacienteId, 'nfse-emitidas']" class="btn btn-outline">Voltar</a>
  </div>
</div>

<div *ngIf="erro" class="alert alert-danger">{{ erro }}</div>
<div *ngIf="loading" class="loading">Carregando...</div>

<form *ngIf="!loading && !parametroInvalido" [formGroup]="form" (ngSubmit)="salvar()" class="form-card">

  <div class="form-row">
    <div class="form-group form-group-sm">
      <label for="competencia">Competência *</label>
      <input id="competencia" type="text" inputmode="numeric" formControlName="competencia" class="form-control"
        placeholder="MM/AAAA" maxlength="7"
        aria-describedby="competenciaError"
        [class.is-invalid]="campo('competencia')?.invalid && campo('competencia')?.touched" />
      <div id="competenciaError" class="invalid-feedback"
        *ngIf="campo('competencia')?.touched && campo('competencia')?.invalid">
        Informe a competência no formato MM/AAAA.
      </div>
    </div>

    <div class="form-group form-group-sm">
      <label for="dataEmissao">Data de emissão *</label>
      <input id="dataEmissao" type="date" formControlName="dataEmissao" class="form-control"
        aria-describedby="dataEmissaoError"
        [class.is-invalid]="campo('dataEmissao')?.invalid && campo('dataEmissao')?.touched" />
      <div id="dataEmissaoError" class="invalid-feedback"
        *ngIf="campo('dataEmissao')?.touched && campo('dataEmissao')?.invalid">
        Data de emissão é obrigatória.
      </div>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group form-group-sm">
      <label for="numeroNota">Número da nota</label>
      <input id="numeroNota" type="text" formControlName="numeroNota" class="form-control"
        maxlength="60"
        [class.is-invalid]="campo('numeroNota')?.invalid && campo('numeroNota')?.touched" />
      <div class="invalid-feedback" *ngIf="campo('numeroNota')?.touched && campo('numeroNota')?.invalid">
        O número da nota deve ter no máximo 60 caracteres.
      </div>
    </div>

    <div class="form-group form-group-sm">
      <label for="valor">Valor</label>
      <input id="valor" type="number" step="0.01" min="0" formControlName="valor" class="form-control"
        [class.is-invalid]="campo('valor')?.invalid && campo('valor')?.touched" />
      <div class="invalid-feedback" *ngIf="campo('valor')?.touched && campo('valor')?.invalid">
        O valor não pode ser negativo.
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="observacoes">Observações</label>
    <textarea id="observacoes" formControlName="observacoes" class="form-control" rows="3"></textarea>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="salvando">
      {{ salvando ? 'Salvando...' : (modoEdicao ? 'Atualizar' : 'Cadastrar') }}
    </button>
    <a *ngIf="pacienteId" [routerLink]="['/pacientes', pacienteId, 'nfse-emitidas']" class="btn btn-outline">Cancelar</a>
  </div>
</form>
